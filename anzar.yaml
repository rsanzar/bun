apps:
  bun-server:
    ci:
      jobs:
        - name: prepare-code
          runtime: bun-v1
          tshirt: standard
          commands:
            # - bun build server.js --compile --outfile server
            - cp server.js /app/server.js
    cd:
      runtime: bun-v1
      tshirt: standard
      start_commands: 
         # 💥 1. Tune the Linux TCP stack dynamically
         - sysctl -w net.ipv4.ip_local_port_range="1024 65535"
         - sysctl -w net.ipv4.tcp_tw_reuse=1
         - sysctl -w net.core.somaxconn=65535
         - sysctl -w net.ipv4.tcp_max_syn_backlog=65535

         
         # 💥 2. Chain ulimit and node in the same shell session
         - sh -c 'ulimit -n 65535 && exec bun /app/server.js'
        
      port: 3000
